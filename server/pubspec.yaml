name: checklist_server
description: Serves checklists to the web app over HTTP and a WebSocket.
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  checklist_core:
    path: ../packages/checklist_core
  drift: ^2.32.0
  shelf: ^1.4.0
  shelf_static: ^1.1.0
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  http: ^1.2.0
  lints: ^6.0.0
  test: ^1.25.0

